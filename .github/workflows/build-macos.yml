name: Build macOS (dmg)

# Manual one-click macOS build. Produces an unsigned .dmg for Apple Silicon and Intel.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. 1.8.1-mac)"
        required: false
        default: "1.8.1-mac"

permissions:
  contents: read

jobs:
  dmg:
    name: dmg (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: x64
            runner: macos-15-intel
    env:
      BITCHORD_DESKTOP_ONLY: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make .icns from AppIcon.png
        shell: bash
        run: |
          set -euo pipefail
          src=desktopApp/packaging/icons/AppIcon.png
          set_dir=$RUNNER_TEMP/AppIcon.iconset
          mkdir -p "$set_dir"
          for s in 16 32 128 256 512; do
            sips -z $s $s "$src" --out "$set_dir/icon_${s}x${s}.png" >/dev/null
            d=$((s*2))
            sips -z $d $d "$src" --out "$set_dir/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$set_dir" -o "$RUNNER_TEMP/AppIcon.icns"

      - name: Package dmg
        shell: bash
        run: |
          ./gradlew :desktopApp:packageDmg \
            -Pbitchord.target=macos \
            -Pbitchord.macArch=${{ matrix.arch }} \
            -Pbitchord.version="${{ inputs.version }}" \
            -Pbitchord.macIcon="$RUNNER_TEMP/AppIcon.icns" \
            --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: BitChord-macOS-${{ matrix.arch }}
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          if-no-files-found: error
